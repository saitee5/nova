# NOVA Data Provenance Manifest
# Tracks the origins, classifications, and licenses for all datasets used by NOVA.

version: "1.0"
updated_at: "2026-09-11"

provenance_categories:
  REAL_INDUSTRIAL_DATA:
    description: "Anonymized real-world industrial plant telemetry and historical records."
    restricted: true

  SIMULATED_BENCHMARK:
    description: "Standard simulated academic/industry benchmark datasets (e.g. Tennessee Eastman Process)."
    restricted: false

  PUBLIC_KNOWLEDGE:
    description: "Public safety reports, CSB incident retrospectives, OSHA guidelines, and HAZOP standards."
    restricted: false

  SYNTHETIC_NOVA_DATA:
    description: "Algorithmic synthetic telemetry, permits, alarms, and operational episodes generated by NOVA simulators."
    restricted: false

datasets:
  - id: "tep_benchmark"
    name: "Tennessee Eastman Process (TEP) Benchmark"
    category: "SIMULATED_BENCHMARK"
    path: "data/raw/tep/"
    description: "Simulation benchmark data for process anomaly detection and fault classification. NOT real refinery telemetry."
    license: "Open Academic"

  - id: "furnace_cot_dataset"
    name: "Industrial Ethylene Cracking Furnace COT Dataset"
    category: "REAL_INDUSTRIAL_DATA"
    path: "data/raw/furnace_cot/ethylene_furnace_30015_samples.xlsx"
    source: "Figshare Article 29804525 / PLOS ONE Benchmark"
    doi: "10.6084/m9.figshare.29804525"
    sha256: "8591f494a6dabf63e28084c191f430993fc03781a25644941c601dc7561f6371"
    rows: 30015
    columns: 17
    target: "coil_outlet_temperature"
    target_unit: "celsius"
    features_count: 16
    description: "Authentic industrial ethylene cracking furnace telemetry and component yields predicting coil outlet temperature."


  - id: "furnace_soft_sensor_dataset"
    name: "Cracking Furnace Tube-Temperature Soft Sensor Dataset"
    category: "REAL_INDUSTRIAL_DATA"
    path: "data/raw/furnace_soft_sensor/"
    description: "Tube skin temperature and operational variables for soft-sensor modeling."

  - id: "synthetic_telemetry"
    name: "NOVA Reference Ethylene Plant Synthetic Telemetry"
    category: "SYNTHETIC_NOVA_DATA"
    path: "data/synthetic/telemetry/"
    description: "Simulated stream data for F-201A, E-201, K-201, V-201, P-201A/B, T-201."
